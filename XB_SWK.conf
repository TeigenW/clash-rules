# ==================== 地区分组（已修正语法） ====================
🏠 Home = select, 家宽|Home|住宅|宅|ISP, []

🇭🇰 HK = url-test, 🇭🇰|香港|HK|Hong Kong, http://www.gstatic.com/generate_204, 300, 50, []

🇼🇸 TW = select, 🇼🇸|台|TW|Taiwan, []

🇺🇲 US = select, ^(?=.*(🇺🇲|美|US|States))(?=.*(宅|专线|原)), []

🇺🇲 US-T = select, ^(?=.*(🇺🇲|美|US|States))(?!.*(宅|专线|原)), []

# 修正：筛选新加坡，排除“飞鸟”和“白嫖”
🇸🇬 SG = select, ^(?=.*(🇸🇬|坡|SG|Singapore))(?!.*(飞鸟|白嫖)), []

🇰🇷 KR = select, 🇰🇷|韩|KR|Korea, []

🇯🇵 JP = url-test, 🇯🇵|日|JP|Japan, http://www.gstatic.com/generate_204, 300, 50, []

🇩🇪 DE = url-test, 🇩🇪|德|DE|Germany, http://www.gstatic.com/generate_204, 300, 50, []

🇬🇧 UK = url-test, 🇬🇧|英|UK|United Kingdom, http://www.gstatic.com/generate_204, 300, 50, []

🇮🇳 印度 = url-test, 🇮🇳|印|IN|India, http://www.gstatic.com/generate_204, 300, 50, []

# 修正：小众节点筛选，排除主流地区
🇺🇳 小众 = url-test, ^(?!.*(港|HK|台|TW|坡|SG|美|US|韩|KR|日|JP|德|DE|印|India|UK|英国|AA)).*$, http://www.gstatic.com/generate_204, 300, 50, []

# 修正参数位置
🏁 剩余流量 = url-test, 🇦🇦|GB, http://www.gstatic.com/generate_204, 300, 50, []

