[Rule]
# >>>>>>>>>>>>>> 基础规则 <<<<<<<<<<<<<<
# UDP 443/3478 拒绝（防 QUIC 连接问题）
UDP, 443, REJECT
UDP, 3478, REJECT

# IPv6 拒绝
IP-CIDR6, ::/0, REJECT, no-resolve

# 广告拦截
