# >>>>>>>>>>>>>> 基础与系统设置 (强制关掉 IPv6 杜绝超时) <<<<<<<<<<<<<<
port: 7892
socks-port: 7891
redir-port: 0
mixed-port: 7890
allow-lan: false # 不共享代理，降低局域网暴露面
mode: rule
ipv6: false # 关闭 IPv6：不解析/不优先 AAAA，降低双栈出口
find-process-mode: strict # 提升 PROCESS-NAME 规则匹配准确度（ChatGPT/Infuse 等）

# 👉【采纳自官方文档的黄金配置】：防风控、保护 SSD、极致加速网页加载
global-ua: "clash-verge/v2.5.1"
global-client-fingerprint: "chrome" # 👈【核心防封】：全局模拟 Chrome TLS 浏览器指纹，极大降低 ChatGPT/Claude 阻断概率
tcp-concurrent: true # 👈【极速首字】：TCP 并发拨号，自动选择响应最快的 IP，网页加载零卡顿
log-level: warning # 👈【保护硬盘】：将日志级别降为 warning，减少 Mac 固态硬盘（SSD）无谓写入
geo-auto-update: true # 👈【自动维护】：每日在后台自动更新本地分流数据库，无需人工干预
geo-update-interval: 24

# 👉【采纳官方文档】：开启全局设置记忆、Geodata 性能优化以及统一延迟统计
profile:
  store-selected: true # 👈永久记忆你手动选好的节点，更新订阅不重置！
  store-fake-ip: true # 👈持久化假 IP 映射表，彻底杜绝重载配置后的应用断连
geodata-mode: true # 👈【性能优化】：开启本地 Geodata 极速分流，极大地降低 CPU 与内存占用
geodata-loader: standard
unified-delay: true # 👈【测速优化】：显示真实应用延迟

# >>>>>>>>>>>>>> Meta/Mihomo 优化版 TUN 模式 (防漏核心) <<<<<<<<<<<<<<
tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true # 严格路由：关闭可加快速度，开启可防 DNS 泄漏
  auto-detect-interface: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

# >>>>>>>>>>>>>> 域名嗅探 (减少纯 IP 流量误判/漏分) <<<<<<<<<<<<<<
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

# >>>>>>>>>>>>>> 彻底防止 DNS 泄露并解决“解析死锁与直连超时”的 DNS 设置 <<<<<<<<<<<<<<
dns:
  enable: true
  ipv6: false # DNS 不返回 AAAA，避免浏览器 Happy Eyeballs 走 IPv6
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 127.0.0.1:1053 # 仅本机监听，配合 allow-lan: false

  # 👉【关键改进 1】：让 DNS 查询连接本身也遵循路由规则
  # 开启后，对 nameserver 中海外 DoH（如 dns.google）的请求会走代理节点加密发出
  # 从而彻底解决因直连海外 DoH 遭 GFW 拦截导致的 context deadline exceeded 报错
  respect-rules: true

  # 仅用于冷启动解析海外 DoH 的服务器 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 👉【关键改进 2】：专门用于直连（DIRECT）出口域名的解析服务器
  # 彻底解决 updates.cdn-apple.com 和 www.bing.com 等直连域名因走海外 DNS 失败而导致的解析超时
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 是否让直连解析优先遵循 nameserver-policy（推荐开启，确保内网/私有域名正确解析）
  direct-nameserver-follow-policy: true

  # 👉【核心防死锁设计】：专门用来解析机场节点域名的 DNS（解决测速 Timeout 僵局）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://223.5.5.5

  # 核心防泄露设计：日常海外/未分流解析仅允许走代理节点的安全 DoH
  # 配合 respect-rules: true，这些请求将安全地通过代理发出，规避本地泄露与直接阻断
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  # 策略分流：采用本地安全解析
  nameserver-policy:
    "geosite:cn,private":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"

  fake-ip-filter:
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    - "+.local"
    - "localhost"
    - "+.localhost"
    - "*.lan"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "time.*"
    - "ntp.*"
    - "time.apple.com"
    - "ntp.aliyun.com"
    - "ntp.tencent.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.wpsmail.net"
    - "+.henzanapp.com"
    - "+.pconline.com.cn"
