# =============================
#     1.全局基础设置(Global)
# =============================
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning # 将日志级别降为 warning，减少 SSD 硬盘写入
external-controller: 127.0.0.1:9090 # 方便面板管理
ipv6: false

# 网页与连接参数优化
global-ua: "clash-verge/v2.5.1"
global-client-fingerprint: "chrome" # 全局模拟 Chrome TLS 浏览器指纹，降低被阻断概率
unified-delay: true # 显示真实应用延迟
tcp-concurrent: true # TCP 并发拨号，自动选择响应最快的 IP
keep-alive-idle: 600
keep-alive-interval: 15
find-process-mode: strict # 使用 strict 模式匹配更精准

# 保存上次手动选择的节点信息
profile:
  store-selected: true # 永久记忆你手动选好的节点，更新订阅不重置
  store-fake-ip: true # 持久化假 IP 映射表，彻底杜绝重载配置后的应用断连

# =============================
#   2.数据库设置(Meta 专属)
# =============================
# 自动更新最新的 IP 和域名库，分流更准
geodata-mode: true # 开启本地 Geodata 极速分流，极大降低 CPU 与内存占用
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# =============================
#     3. 入站设置(TUN 模式)
# =============================
# 接管系统所有流量（包括 UDP/WebRTC）的关键
tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true # 严格路由：开启可防 DNS 泄漏
  auto-detect-interface: true
  # 强制劫持所有 DNS 请求，防止 DNS 泄漏
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

# =============================
#    4.嗅探设置(Sniffer)
# =============================
# 必须开启，为了让 Tun 模式下的流量能被正确还原成域名
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true # 关键：对只有 IP 的请求进行强制嗅探域名
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443]
      override-destination: true

# =============================
#   5. DNS 设置 (Fake-IP 模式)
# =============================
dns:
  enable: true
  listen: 0.0.0.0:1053 # 支持局域网设备请求 DNS
  ipv6: false # DNS 不返回 AAAA，降低双栈出口超时概率
  enhanced-mode: fake-ip # 开启 fake-ip 模式
  fake-ip-range: 198.18.0.1/16 # 虚假IP 范围
  respect-rules: true # 让 DNS 查询连接本身也遵循路由规则，海外 DoH 通过代理安全发出

  # 仅用于冷启动解析海外 DoH 的服务器 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 专门用于直连出口域名的解析服务器
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  direct-nameserver-follow-policy: true

  # 专门用来解析机场节点域名的 DNS（解决测速 Timeout 僵局）
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://223.5.5.5

  # 日常海外/未分流解析仅允许走代理节点的安全 DoH，彻底规避本地泄漏与直接阻断
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query

  # 策略分流：采用本地安全解析
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
      - 223.5.5.5

  fake-ip-filter:
    - "rule-set:private,cn_domain" # 不使用 Fake IP 的域名规则集
    - "geosite:cn"
    - "geosite:private"
    - "+.lan"
    - "+.local"
    - "localhost"
    - "+.localhost"
    - "time.*"
    - "ntp.*"
    - "time.*.com"
    - "time.apple.com"
    - "ntp.aliyun.com"
    - "ntp.tencent.com"
    - "+.market.xiaomi.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.stun.*" # 让 STUN 请求不走 Fake-IP
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "*.stun.playstation.net"
    - "*.srv.nintendo.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.wpsmail.net"
    - "+.henzanapp.com"
    - "+.pconline.com.cn"

