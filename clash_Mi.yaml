# >>>>>>>>>>>>>> 规则策略 (规则字段严格用双引号) <<<<<<<<<<<<<<
rules:
  - "AND,((NETWORK,UDP),(DST-PORT,443)),REJECT"
  - "AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT"

  # 本地 IPv6 目的地址一律拒绝（纯 IPv6 字面量/漏网）
  - "IP-CIDR6,::/0,REJECT,no-resolve"

  # 广告拦截
  - "RULE-SET,reject,⛔️ 广告拦截"

  # 局域网本地和特定域名跳过列表
  - "DOMAIN-SUFFIX,crashlytics.com,✅ 直连"
  - "DOMAIN,seed-sequoia.siri.apple.com,✅ 直连"
  - "DOMAIN,sequoia.apple.com,✅ 直连"

  # Emby
  - "PROCESS-NAME,Infuse,🎬 Emby"
  - "PROCESS-NAME,SenPlayer,🎬 Emby"
  - "DOMAIN-KEYWORD,emby,🎬 Emby"
  - "RULE-SET,emby,🎬 Emby"

  # 私有域 & 本地
  - "RULE-SET,private,✅ 直连"
  - "OR,((DOMAIN-SUFFIX,jetbrains.com),(DOMAIN-SUFFIX,ugreengroup.com),(DOMAIN-SUFFIX,msftconnecttest.com),(DOMAIN-SUFFIX,appstorrent.ru),(DOMAIN-SUFFIX,zerotier.com),(DOMAIN-SUFFIX,imgse.com),(IP-CIDR,127.0.0.1/32,no-resolve)),✅ 直连"

  # GitHub
  - "RULE-SET,github,🥷 GitHub"

  # AI 智能服务
  - "DOMAIN,downloads.claude.ai,⬇️ 下载"
  - "RULE-SET,Bing,Ⓜ️ 微软服务"
  - "DOMAIN,aistudio.google.com,💬 AI"
  - "RULE-SET,openai,💬 AI"
  - "RULE-SET,gemini,💬 AI"
  - "RULE-SET,claude,💬 AI"
  - "RULE-SET,copilot,💬 AI"
  - "RULE-SET,grok,💬 AI"
  - "PROCESS-NAME,ChatGPT,💬 AI"

  # Crypto & SIM 卡
  - "RULE-SET,crypto,💸 Crypto"
  - "DOMAIN-KEYWORD,giffgaff,💸 Crypto"

  # 微软 & 苹果
  - "RULE-SET,microsoft,Ⓜ️ 微软服务"
  - "RULE-SET,apple,🍎 苹果服务"
  - "RULE-SET,apple-loyalsoldier,🍎 苹果服务"
  - "RULE-SET,icloud,🍎 苹果服务"
  - "DOMAIN-SUFFIX,apple.com,🍎 苹果服务"

  # 社交媒体
  - "RULE-SET,telegramcidr,📲 Telegram,no-resolve"
  - "RULE-SET,telegram,📲 Telegram"
  - "RULE-SET,discord,📱 Discord"
  - "RULE-SET,twitter,🖥️ Twitter"
  - "RULE-SET,facebook,👤 FACEBOOK"
  - "RULE-SET,reddit,📖 Reddit"

  # 流媒体与娱乐
