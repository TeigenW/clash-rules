# ============================================
# 规则 锚点模板
# ============================================
rule-anchor:
  # IP-CIDR 规则模板 (二进制格式)
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }

  # Domain 规则模板 (二进制格式)
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }

  # Classical 规则模板 (文本/YAML 格式)
  classical:
    &classical {
      type: http,
      interval: 86400,
      behavior: classical,
      format: text,
    }

