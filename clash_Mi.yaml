  - "RULE-SET,netflix,🎥 奈飞视频"
  - "RULE-SET,tiktok,📹 TikTok"
  - "RULE-SET,bahamut,📺 巴哈姆特"
  - "RULE-SET,netease,✅ 直连"
  - "RULE-SET,spotify,🥬 Spotify"
  - "DOMAIN-KEYWORD,spotify,🥬 Spotify"
  - "RULE-SET,chinamedia,✅ 直连"
