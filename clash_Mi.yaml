# =============================
#         7. 规则 (Rules)
# =============================
rules:
  # ---------------- 🛡️ 绝杀规则 (必须在最前) ----------------
  # 阻断 QUIC，防止因 UDP 握手造成真实 IP 泄漏
  - "AND,((NETWORK,UDP),(DST-PORT,443)),REJECT"
  # 阻断 WebRTC STUN (UDP 3478)
  - "AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT"
  # 杜绝局域网之外的所有纯 IPv6 出口，防止双栈漏过代理
  - "IP-CIDR6,::/0,REJECT,no-resolve"

  # ---------------- 🚦 普通分流 ----------------
  # 广告拦截
  - "RULE-SET,reject,⛔️ 广告拦截"
  - "RULE-SET,AD,⛔️ 广告拦截"

  # 局域网本地和特定域名跳过列表
  - "DOMAIN-SUFFIX,crashlytics.com,✅ 直连"
  - "DOMAIN,seed-sequoia.siri.apple.com,✅ 直连"
  - "DOMAIN,sequoia.apple.com,✅ 直连"

  # AI 防风控
  - "DOMAIN,downloads.claude.ai,⬇️ 下载"
  - "DOMAIN,aistudio.google.com,💬 AI"
  - "RULE-SET,Bing,Ⓜ️ 微软服务"
  - "GEOSITE,openai,💬 AI,no-resolve"
  - "PROCESS-NAME,/Applications/ChatGPT.app/Contents/MacOS/ChatGPT,💬 AI"
  - "PROCESS-NAME,ChatGPT,💬 AI"
  - "RULE-SET,Open-ai,💬 AI,no-resolve"
  - "RULE-SET,Gemini-ai,💬 AI,no-resolve"
  - "RULE-SET,ai-!cn,💬 AI,no-resolve"
  - "RULE-SET,ai-IP,💬 AI"
  - "RULE-SET,openai,💬 AI"
  - "RULE-SET,gemini,💬 AI"
  - "RULE-SET,claude,💬 AI"
  - "RULE-SET,copilot,💬 AI"
